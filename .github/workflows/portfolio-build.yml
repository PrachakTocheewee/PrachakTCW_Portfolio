name: Portfolio build check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Test festival calendar
        run: node --test tests/festivalCalendar.test.mjs
      - name: Compile portfolio
        run: npm run build
      - name: Verify static output and Worker config
        run: |
          test -s dist/index.html
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(c.name!=='prachak'||c.assets.directory!=='./dist') process.exit(1)"
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Responsive smoke tests
        run: node tests/responsive-smoke.mjs
